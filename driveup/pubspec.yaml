name: driveup
description: "Aplicativo DriveUP - Projeto Flutter"
publish_to: 'none' 

version: 1.0.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter

  # Ícones no estilo iOS (já padrão)
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/driveup_logo.png
    - assets/icons/email.png
    - assets/icons/senha.png
    - assets/icons/facebook.png
    - assets/icons/google.png
    - assets/icons/apple.png
    
